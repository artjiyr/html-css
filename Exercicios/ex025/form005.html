<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Gênero</legend>
            <input type="radio" name="genero" id="isexmasc" value="M"> <label for="isexmasc"> Masculino </label> <br>
            <input type="radio" name="genero" id="isexfem" checked value="F"> <label for="isexfem"> Femnino </label> <br>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="esfut" id="iesftu" value="Futebol"> <label for="iesftu">Futebol</label> <br>
            <input type="checkbox" name="esbas" id="iesbas" value="Basquete"> <label for="iesbas" >Basquete</label> <br>
            <input type="checkbox" name="esvo" id="iesvo" value="Volei"> <label for="iesvo">Vôlei</label> <br>
            <input type="checkbox" name="esnat" id="iesnat" value="Nataçao"> <label for="iesnat">Natação</label> <br>
        </fieldset>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
