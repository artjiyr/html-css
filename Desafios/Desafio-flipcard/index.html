<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front">
                    <img src="imagens/Akane Tendo and Ranma Saotome.jpg" alt="A imagem da Akane" class="flip-card-image">
                </div>
                <div class="flip-card-back">
                    <img src="imagens/Ranma Saotome .jpg" alt="Imagem do Ranma" class="flip-card-image">
                </div>
            </div>
        </div>
    </div>
</body>
</html>
