<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Bar Yamito Hikari</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider">
        <div class="list">
            <div class="item"><img src="imagerns/mari.JPG" alt=""></div>
            <div class="item"><img src="imagerns/hinsuki.JPG" alt=""></div>
            <div class="item"><img src="imagerns/tadash.JPG" alt=""></div>
        </div>

        <!--botão next e prev-->
        <div class="buttons">
            <button id="prev"><</button>
            <button id="next">></button>
        </div>

        <!-- dots ( if 3 items => 3 dots)-->
         <ul class="dots">
            <li class="active"></li>
            <li></li>
            <li></li>
         </ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
